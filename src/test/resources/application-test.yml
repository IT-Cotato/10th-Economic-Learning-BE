spring:
  config:
    activate:
      on-profile: test

  application:
    name: ripple-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: SA
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    openai:
      api-key: dummy-openai-key

  jwt:
    secret: dummy-jwt-secret-key
    access:
      token:
        expiration: 3600000 # 1시간 (밀리초)

cloud:
  aws:
    s3:
      bucket: dummy-test-bucket
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      accessKey: dummy-access-key
      secretKey: dummy-secret-key

logging:
  level:
    org.springframework.transaction: DEBUG
    # org.hibernate.SQL: DEBUG  # SQL 로그도 보고 싶다면
    org.hibernate.resource.transaction: DEBUG
    org.springframework.transaction.interceptor: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG

swagger:
  server:
    url: http://localhost:8080