spring:
  config:
    activate:
      on-profile: test

  application:
    name: ripple-test

  datasource:
    url: jdbc:mysql://localhost:3306/test
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: '0000' # 무조건 ''로 감싸야 함
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

  ai:
    openai:
      api-key: dummy-openai-key

  jwt:
    secret: dummy-jwt-secret-key
    access:
      token:
        expiration: 3600000 # 1시간 (밀리초)

cloud:
  aws:
    s3:
      bucket: dummy-test-bucket
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      accessKey: dummy-access-key
      secretKey: dummy-secret-key

logging:
  level:
    org.springframework.transaction: ERROR
    # org.hibernate.SQL: DEBUG  # SQL 로그도 보고 싶다면
    org.hibernate.resource.transaction: ERROR
    org.springframework.transaction.interceptor: ERROR
    org.springframework.orm.jpa.JpaTransactionManager: ERROR

swagger:
  server:
    url: http://localhost:8080